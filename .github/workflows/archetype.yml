name: Archetype — build & deploy

# This repo publishes GitHub Pages straight from the main branch root
# (no Pages build step), so "deploying" the app means keeping the committed
# build output in archetype/ in sync with the source in _src/archetype/.
#
# - On pull requests: build and verify the committed archetype/ matches the source.
# - On pushes to main: build and, if archetype/ is stale, commit the fresh output.

on:
  push:
    branches: [main]
    paths:
      - "_src/archetype/**"
      - ".github/workflows/archetype.yml"
  pull_request:
    paths:
      - "_src/archetype/**"
      - ".github/workflows/archetype.yml"

permissions:
  contents: write

concurrency:
  group: archetype-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _src/archetype/package-lock.json

      - name: Install
        working-directory: _src/archetype
        run: npm ci

      - name: Build
        working-directory: _src/archetype
        run: npm run build

      - name: Check committed output is current
        id: diffcheck
        run: |
          if git status --porcelain -- archetype/ | grep -q .; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            git status --porcelain -- archetype/
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail PR if archetype/ is stale
        if: github.event_name == 'pull_request' && steps.diffcheck.outputs.stale == 'true'
        run: |
          echo "::error::archetype/ is out of date. Run 'npm run build' in _src/archetype and commit the result."
          exit 1

      - name: Commit fresh build to main
        if: github.event_name == 'push' && steps.diffcheck.outputs.stale == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archetype/
          git commit -m "archetype: rebuild from _src/archetype"
          git push
