<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#152e33;background:#eef3f3;font-size:16px;line-height:1.5;--ink:#123d40;--accent:#106668;--line:#cbd9dc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button,.button{min-height:48px;border-radius:10px;border:1px solid var(--line);padding:10px 15px;background:#fff;color:var(--ink);font-weight:650;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}button.danger{color:#942f25;border-color:#cfa59f}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e4aa36;outline-offset:3px}button:disabled{opacity:.5}header{background:var(--ink);color:#fff;padding:20px max(18px,calc((100vw - 760px)/2));padding-top:max(20px,env(safe-area-inset-top))}header .eyebrow{font-size:.75rem;letter-spacing:.16em;font-weight:700;text-transform:uppercase;color:#bfe1df}h1{font-size:1.65rem;line-height:1.2;margin:5px 0 12px}h2{font-size:1.4rem;margin:0 0 8px;line-height:1.3}h3{font-size:1.1rem;margin:0 0 8px}p{margin:6px 0 14px}.muted,small{color:#4e646b}small,.small{font-size:.875rem}.headerline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.pill{font-size:.875rem;border:1px solid #689193;border-radius:7px;padding:4px 9px;color:#fff}main{max-width:800px;margin:auto;padding:16px 16px 115px}.card{border:1px solid var(--line);background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 3px #123d4005}.notice{padding:12px 14px;border-radius:10px;background:#fff4da;border:1px solid #dec389;font-size:.875rem;margin-bottom:14px}.notice strong{color:#563d09}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1}.row .compact{flex:0 0 auto}.stack{display:grid;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}label{display:block;font-size:.9rem;font-weight:650;margin-bottom:5px}input,select,textarea{width:100%;max-width:100%;min-width:0;min-height:48px;border:1px solid #a9bec3;background:#fff;border-radius:8px;padding:11px;color:#152e33}textarea{min-height:92px;resize:vertical;line-height:1.5}input[type=checkbox]{width:24px;min-height:24px}select{padding-right:28px}details{margin:0 0 14px}summary{font-weight:700;cursor:pointer;min-height:48px;display:flex;align-items:center;gap:8px}summary:before{content:'+';font-size:1.3rem;color:var(--accent)}details[open]>summary:before{content:'−'}details.card>summary{margin:-7px 0}details[open].card>summary{margin-bottom:12px}.check{padding:13px 0;border-top:1px solid #e0e8ea}.check:first-of-type{border-top:0}.check .grid{grid-template-columns:1fr 1fr;gap:8px}.check label{font-size:1rem}.check small{display:block;margin-bottom:8px}.stepnum{display:inline-flex;align-items:center;justify-content:center;background:#dff0ed;border-radius:6px;width:30px;height:30px;margin-right:8px;color:var(--ink)}nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid var(--line);padding:7px 8px max(9px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px}nav button{flex:1;max-width:150px;font-size:.8rem;min-height:55px;border:0;flex-direction:column;gap:1px;padding:5px 2px}nav button span{font-size:1.15rem;line-height:1.2}nav button[aria-current=page]{background:var(--ink);color:#fff}.toolbar{margin-bottom:14px}.toolbar button{padding:8px 11px}.sectionhead{margin:7px 0 16px}.sectionhead p{font-size:.9rem;margin:0;color:#4e646b}.subhead{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:750;margin-bottom:5px}.report{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.875rem;word-break:break-word;line-height:1.65}.timebar{border-left:4px solid #dfaa39;padding:10px 12px;background:#fff9e9;margin:0 0 14px;border-radius:6px}.timebar p{margin:0}.record{padding:14px 0;border-top:1px solid var(--line)}.record p{margin:4px 0}.empty{padding:18px;border:1px dashed #a9bec3;border-radius:10px;color:#4e646b}.dangertext{color:#942f25}.banner{position:sticky;top:0;z-index:6;margin:0;border-radius:0;background:#ffe1dc;border:0;padding:12px 18px;color:#7a221d}#toast{position:fixed;bottom:94px;left:50%;transform:translateX(-50%);background:#123d40;color:#fff;border-radius:10px;padding:12px 18px;z-index:20;max-width:90vw;width:max-content;box-shadow:0 4px 20px #0003}#printArea{display:none}ol{padding-left:22px}li{margin-bottom:8px}a{color:#0a6166}footer{font-size:.8rem;color:#4e646b;margin:22px 0 8px}#patientPick{background:#fff}dialog{border:0;border-radius:16px;max-width:480px;width:calc(100% - 28px);padding:24px;color:#152e33}dialog::backdrop{background:#123d40aa}dialog button{width:100%;margin-top:10px}[hidden]{display:none!important}@media(max-width:370px){.grid{grid-template-columns:1fr}.check .grid{grid-template-columns:1fr}.card{padding:14px}h1{font-size:1.45rem}nav button{font-size:.75rem}}@media print{header,main,nav,dialog,#toast,#saveWarning{display:none!important}#printArea{display:block;white-space:pre-wrap;font:11pt/1.45 sans-serif;color:#000;overflow-wrap:anywhere}body{background:#fff}@page{margin:16mm}}
</style></head><body>
<div id="saveWarning" class="banner" role="alert" hidden></div>
<header><div class="eyebrow">Wilderness first aid</div><h1>Field Notes</h1><div class="headerline"><span id="saveStatus" class="small">Ready</span><span id="offlineStatus" class="pill">Checking offline access</span></div></header>
<main><noscript><div class="notice">JavaScript is required. Open this file in a browser or an HTML viewer that runs JavaScript. A file preview may not run the app.</div></noscript><div class="row toolbar"><div><label for="patientPick">Current patient / practice scenario</label><select id="patientPick"></select></div><button id="newPatient" class="compact" style="margin-top:26px">＋ New</button></div><div id="timerBar" class="timebar" hidden></div><div id="view"></div><footer>Adapted from your SOLO forms · Device-local records · v1.0</footer></main>
<nav aria-label="Assessment sections"><button data-tab="scene" aria-current="page"><span aria-hidden="true">01</span>Assess</button><button data-tab="history"><span aria-hidden="true">02</span>History</button><button data-tab="vitals"><span aria-hidden="true">03</span>Vitals</button><button data-tab="soap"><span aria-hidden="true">04</span>SOAP</button><button data-tab="records"><span aria-hidden="true">05</span>Save / Help</button></nav>
<div id="toast" role="status" hidden></div><pre id="printArea"></pre>
<dialog id="confirmDialog"><h2 id="confirmTitle"></h2><p id="confirmText"></p><button id="confirmYes" class="danger">Delete</button><button id="confirmNo">Cancel</button></dialog>
<script>
'use strict';
const KEY='wilderness-field-notes-v1';
const sceneGroups=[['Scene size-up',[
['sceneSafe','Scene safety','Hazards and your ability to approach safely.'],['patientSafe','Patient safety','Current exposure to danger.'],['bsi','Body substance isolation (BSI)','PPE and exposure precautions.'],['consent','Consent / ability to consent','Added documentation field.']]],['Primary survey',[
['conscious','Consciousness / responsiveness','Record the response you observe.'],['airway','Airway','Record your findings.'],['breathing','Breathing','Record breathing and effort.'],['bleeding','Bleeding','Record location, severity and care.'],['pulse','Pulse','If assessed within your training. Do not delay emergency care to document.'],['chunk','Rapid injury check (“chunk check”)','Serious injuries or other immediate concerns.'],['move','Need to move','Document the need and action taken, if any.'],['position','Position / “de-crumpling”','Document your assessment; movement only as appropriate to your training.'],['environment','Environmental protection','Cold, heat, wetness, sun, wind and shelter.']]]];
const regions=[['head','Head','Scalp, face, eyes, nose, mouth'],['neck','Neck','Neck / spine / trachea observations'],['chest','Chest','Clavicles, shoulders, ribs'],['abdomen','Abdomen','Location of pain, tenderness or injury'],['pelvis','Pelvis','Pain or injury observations'],['legs','Legs','Left / right; circulation, sensation, motion'],['arms','Arms','Left / right; circulation, sensation, motion'],['back','Back','Back / spine observations']];
const ample=[['allergies','A · Allergies','Drugs, foods, insects; reaction if known'],['medications','M · Medications','Prescription and non-prescription; last dose if known'],['past','P · Past pertinent history','Medical conditions, relevant surgery'],['last','L · Last intake and output','Food, fluid, urination / bowel movement; times'],['events','E · Events','What led up to this incident?']];
const vitalFields=[['at','Date & time','datetime-local'],['loc','Level of consciousness','select',['','Alert','Responds to voice','Responds to pain','Unresponsive','Unable to assess']],['orientation','Oriented to','text'],['rr','Respiratory rate / min','number'],['breathEffort','Breathing effort / quality','text'],['hr','Heart rate / min','number'],['pulseQuality','Pulse strength / quality','text'],['skinColor','Skin color','text'],['skinTemp','Skin temperature','text'],['skinMoisture','Skin moisture','text'],['notes','Other vital observations','textarea']];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function localNow(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function uid(){return globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2)}
function fresh(){return {id:uid(),created:new Date().toISOString(),updated:null,fields:{date:localNow(),interval:'15'},checks:{},exam:{},vitals:[],snapshots:[],draft:{at:localNow()},due:null}}
let db={version:1,active:'',patients:[]},tab='scene',editingVital=null,saveFailed=false,loadFailed=false;
try{let raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);validateBackup(parsed);db=parsed}}catch(e){loadFailed=true}
if(!db.patients.length){let p=fresh();db.patients.push(p);db.active=p.id}if(!db.patients.some(x=>x.id===db.active))db.active=db.patients[0].id;
const patient=()=>db.patients.find(p=>p.id===db.active);
function toast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>$('#toast').hidden=true,3500)}
function save(){patient().updated=new Date().toISOString();try{if(loadFailed)throw Error('restore');localStorage.setItem(KEY,JSON.stringify(db));saveFailed=false;$('#saveStatus').textContent='Saved on this device · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('#saveWarning').hidden=true}catch(e){saveFailed=true;$('#saveStatus').textContent='Not saved — export a backup';$('#saveWarning').hidden=false;$('#saveWarning').textContent=loadFailed?'Stored records could not be read. They have not been overwritten. Export any new work, then use Save / Help to import a backup or reset storage.':'Device storage is unavailable or full. Keep this page open and export your work now.'}}
function options(values,current){return values.map(v=>{let [value,label]=Array.isArray(v)?v:[v,v||'Not recorded'];return `<option value="${esc(value)}" ${value===current?'selected':''}>${esc(label)}</option>`}).join('')}
function field(key,label,type='text',hint='',value,attrs=''){const v=value??patient().fields[key]??'';let control=type==='textarea'?`<textarea data-field="${key}" id="f-${key}" ${attrs}>${esc(v)}</textarea>`:`<input type="${type}" data-field="${key}" id="f-${key}" value="${esc(v)}" ${attrs}>`;return `<div><label for="f-${key}">${esc(label)}</label>${control}${hint?`<small>${esc(hint)}</small>`:''}</div>`}
function heading(k,title,sub=''){return `<div class="sectionhead"><div class="subhead">${k}</div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>`}
function picker(){const select=$('#patientPick');select.innerHTML=db.patients.map((p,i)=>`<option value="${esc(p.id)}" ${p.id===db.active?'selected':''}>${esc(p.fields.name||'Patient '+(i+1))} · ${esc((p.fields.date||p.created).slice(0,10))}</option>`).join('')}
function checkRow(item,group='checks'){const [key,label,hint]=item,c=patient()[group][key]||{};return `<div class="check"><label for="${group}-${key}">${esc(label)}</label><small>${esc(hint)}</small><div class="grid"><select id="${group}-${key}" aria-label="${esc(label)} status" data-check="${key}" data-group="${group}">${options([['','Not assessed'],['Assessed','Assessed'],['Concern','Concern noted'],['Not applicable','Not applicable'],['Unable to assess','Unable to assess']],c.status||'')}</select><input aria-label="${esc(label)} findings" placeholder="Findings / action taken" data-checknote="${key}" data-group="${group}" value="${esc(c.note||'')}"></div></div>`}
function sceneView(){return heading('01 · Assessment','Start with the patient','Record findings as you go. “Assessed” does not mean normal.')+`<div class="notice"><strong>Care comes before documentation.</strong> For unresponsiveness, absent / abnormal breathing, severe bleeding or another life threat, activate emergency help and provide care within your training. This app does not call for help.</div><details class="card" open><summary>Patient & incident</summary><div class="grid">${field('name','Patient name / identifier')}${field('date','Incident date & time','datetime-local')}${field('age','Age (include units)','text','For example: 8 years or 6 months')}${field('sex','Sex as reported')}${field('recorder','Your name / role')}${field('location','Location / coordinates')}<div class="full">${field('complaint','Chief complaint','textarea')}</div><div class="full">${field('moi','Mechanism of injury / illness','textarea')}</div></div></details>`+sceneGroups.map(([name,items],i)=>`<details class="card" open><summary><span class="stepnum">${i+1}</span>${name}</summary>${items.map(x=>checkRow(x)).join('')}</details>`).join('')+`<details class="card"><summary><span class="stepnum">3</span>Head-to-toe exam</summary><p class="small muted">Record pain, tenderness and injuries, including side and location. These are documentation prompts, not instructions to move or manipulate an injured person.</p>${regions.map(x=>checkRow(x,'exam')).join('')}${field('examNotes','Additional exam findings','textarea')}</details><button class="primary" data-go="history">Continue to AMPLE history</button>`}
function historyView(){return heading('02 · History','Ask, listen, record','Use “unknown” or “denies” explicitly when appropriate; a blank is not a negative finding.')+`<div class="card stack">${ample.map(([k,l,h])=>field(k,l,'textarea',h)).join('')}</div><div class="card">${field('subjective','Other patient-reported symptoms','textarea','Use the patient’s own words when useful.')}</div><button class="primary" data-go="vitals">Record vital signs</button>`}
function vitalForm(){return vitalFields.map(([key,label,type,values])=>{let v=patient().draft[key]||'';let ctl=type==='select'?`<select id="v-${key}" data-vital="${key}">${options(values,v)}</select>`:type==='textarea'?`<textarea id="v-${key}" data-vital="${key}">${esc(v)}</textarea>`:`<input id="v-${key}" data-vital="${key}" type="${type}" value="${esc(v)}" ${type==='number'?'min="0" step="1" inputmode="numeric"':''}>`;return `<div ${type==='textarea'?'class="full"':''}><label for="v-${key}">${label}</label>${ctl}${key==='orientation'?'<small>Person, place, time, event; record what was checked.</small>':''}</div>`}).join('')}
function vitalSummary(v){return `LOC: ${v.loc||'Not recorded'}; oriented: ${v.orientation||'Not recorded'}\nRR: ${v.rr||'Not recorded'}/min; ${v.breathEffort||'effort not recorded'}\nHR: ${v.hr||'Not recorded'}/min; ${v.pulseQuality||'quality not recorded'}\nSkin: ${v.skinColor||'?'} / ${v.skinTemp||'?'} / ${v.skinMoisture||'?'}${v.notes?'\n'+v.notes:''}`}
function displayTime(t){if(!t)return 'Time not recorded';return new Date(t).toLocaleString([],{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function vitalsView(){return heading('03 · Objective','Vital signs','Each saved set gets its own date and time. Nothing is filled from an earlier set.')+`<div class="card"><h3>${editingVital?'Edit vital set':'New vital set'}</h3><div class="grid">${vitalForm()}</div><div class="row" style="margin-top:14px"><button id="stampVitals">Use current time</button><button class="primary" id="saveVitals">${editingVital?'Save changes':'Save vital set'}</button>${editingVital?'<button id="cancelVital">Cancel edit</button>':''}</div></div><div class="card"><h3>Vitals log · ${patient().vitals.length} sets</h3>${patient().vitals.length?patient().vitals.slice().sort((a,b)=>b.at.localeCompare(a.at)).map(v=>`<div class="record"><strong>${esc(displayTime(v.at))}</strong><p class="report">${esc(vitalSummary(v))}</p><div class="row"><button data-editv="${esc(v.id)}">Edit</button><button class="danger" data-deletev="${esc(v.id)}">Delete</button></div></div>`).join(''):'<div class="empty">No saved vital signs yet.</div>'}</div><button data-go="soap" class="primary">Continue to SOAP</button>`}
function soapView(){return heading('04 · Assessment & plan','Build the SOAP note','Patient details, AMPLE history, exam findings and saved vitals are included automatically.')+`<div class="card"><h3>A · Problem list and P · Plan</h3><div class="stack">${[1,2,3].map(i=>`<div class="grid">${field('problem'+i,'Problem '+i,'textarea')}${field('plan'+i,'Plan for problem '+i,'textarea')}</div>`).join('')}${field('care','Care given & patient response','textarea','Include times, treatments and response; document only care actually given.')}</div></div><details class="card"><summary>Rescue survey / handoff</summary><div class="stack">${field('group','Group condition & readiness','textarea','People remaining, resources and ability to shelter.')}${field('evac','Evacuation decision / plan','textarea')}${field('help','Help requested / communications','textarea','Who, how, when, location communicated and response.')}${field('handoff','Handoff / destination','textarea','Recipient, time and transfer of care.')}</div></details><div class="card"><h3>Ongoing assessment</h3><p class="small muted">Your book prompts re-SOAP every 15 minutes. Set an interval appropriate to your training and patient; do not wait for the timer if the condition changes.</p><div class="grid">${field('interval','Reminder interval (minutes)','number','On-screen only; no locked-phone alarm.',undefined,'min="1" max="1440" inputmode="numeric"')}${field('monitor','Monitoring plan','text','How often and what you will monitor.')}</div><div class="row" style="margin:12px 0"><button id="startTimer">Start / restart reminder</button><button id="stopTimer">Stop reminder</button></div>${field('reassessment','Reassessment observations','textarea','S: needs / symptoms; O: new vitals, splint / bandage circulation; A: changes to problems; P: changes to plan.')}<button id="snapshot" class="primary" style="margin-top:12px">Save timestamped re-SOAP</button><p class="small muted" style="margin-top:8px">Saves a copy of the complete current note and restarts an active reminder. Add fresh vitals separately above.</p></div><details class="card"><summary>Saved reassessments · ${patient().snapshots.length}</summary>${patient().snapshots.length?patient().snapshots.slice().reverse().map((s,i)=>`<details class="record"><summary>${esc(displayTime(s.at))}</summary><pre class="report">${esc(s.text)}</pre><button class="danger" data-deletes="${esc(s.id)}">Delete reassessment</button></details>`).join(''):'<p class="muted">No reassessments saved yet.</p>'}</details><button class="primary" data-go="records">Review / export SOAP note</button>`}
function note(p=patient()){const f=p.fields, out=['WILDERNESS FIRST AID — SOAP NOTE',`Patient: ${f.name||'Not recorded'}`,`Incident: ${f.date?displayTime(f.date):'Not recorded'}`,`Location: ${f.location||'Not recorded'}`,`Recorder: ${f.recorder||'Not recorded'}`,`Last record update: ${p.updated?displayTime(p.updated):'Not saved yet'}`,`Times shown in device local time (${Intl.DateTimeFormat().resolvedOptions().timeZone}).`,'','S — SUBJECTIVE'];const add=(label,v)=>out.push(`${label}: ${v||'Not recorded'}`);add('Age',f.age);add('Sex',f.sex);add('Chief complaint',f.complaint);add('Mechanism of injury / illness',f.moi);add('Other reported symptoms',f.subjective);out.push('','O — OBJECTIVE','Scene / primary survey (status is documentation, not a normal finding):');for(const [group,items] of sceneGroups)for(const [k,l] of items){const c=p.checks[k]||{};out.push(`${l}: ${c.status||'Not assessed'}${c.note?' — '+c.note:''}`)}out.push('','Patient exam:');for(const [k,l] of regions){const c=p.exam[k]||{};out.push(`${l}: ${c.status||'Not assessed'}${c.note?' — '+c.note:''}`)}add('Additional exam',f.examNotes);out.push('','AMPLE history:');for(const [k,l] of ample)add(l,f[k]);out.push('','Vital signs:');if(!p.vitals.length)out.push('No saved vital sets.');for(const v of p.vitals.slice().sort((a,b)=>a.at.localeCompare(b.at)))out.push(displayTime(v.at),vitalSummary(v),'');if(Object.keys(p.draft||{}).some(k=>k!=='at'&&p.draft[k]))out.push('NOTE: A vital-sign draft has not been added to the log.');out.push('','A — ASSESSMENT / P — PLAN');for(let i=1;i<=3;i++){add('Problem '+i,f['problem'+i]);add('Plan '+i,f['plan'+i])}add('Care given / response',f.care);add('Monitoring plan',f.monitor);add('Reminder interval (not a treatment recommendation)',f.interval?f.interval+' minutes':'');add('Latest reassessment observations',f.reassessment);out.push('','RESCUE / HANDOFF');for(const [k,l] of [['group','Group condition / readiness'],['evac','Evacuation plan'],['help','Help / communications'],['handoff','Handoff']])add(l,f[k]);return out.join('\n')}
function fullNote(){let p=patient();return note(p)+(p.snapshots.length?'\n\nSAVED REASSESSMENTS\n'+p.snapshots.map(s=>'\n=== '+displayTime(s.at)+' ===\n'+s.text).join('\n'):'')}
function recordsView(){return heading('05 · Save & handoff','Your patient record','Review before sharing. Records stay in this browser unless you export them.')+`<div class="card"><div class="row"><button id="shareNote" class="primary">Share note</button><button id="copyNote">Copy text</button></div><div class="row" style="margin-top:10px"><button id="downloadNote">Download .txt</button><button id="printNote">Print / PDF</button></div><details style="margin:12px 0 0"><summary>Preview full SOAP note</summary><pre id="reportPreview" class="report">${esc(fullNote())}</pre></details></div><div class="card"><h3>Back up records</h3><p class="small muted">Browser data can be cleared by the device. Export a backup after class or patient handoff. Backups include all patients and are not encrypted.</p><div class="row"><button id="backup">Export all records</button><button id="importButton">Import backup</button></div><input id="importFile" type="file" accept=".json,application/json" hidden><p class="small muted" style="margin-top:10px">Import adds records as new copies; it does not replace existing patients.</p></div><details class="card" open><summary>Use on your phone without service</summary><ol><li>While online, open this app in Safari. On iPhone, choose <strong>Share → Add to Home Screen</strong> (enable “Open as Web App” if offered).</li><li>Open the Home Screen app while still online. Wait for <strong>Offline copy ready</strong>. Browser and Home Screen storage may be separate.</li><li>Turn on Airplane Mode, fully close the app, then reopen it. Create a practice entry and reopen again to check it saved.</li><li>If either check fails, keep a paper form available. Download the HTML copy below for use in a JavaScript-capable HTML viewer; the iPhone Files preview may not run apps.</li></ol><p class="small muted">Reminders only update while the app is open. No background alerts, GPS tracking, automatic emergency calls or cloud sync. Export before changing browsers, removing the app or clearing website data.</p><button id="downloadApp">Download offline HTML</button></details><details class="card"><summary>About the source forms</summary><p class="small">Adapted from the supplied SOLO <em>SOAPnote</em> (p. 93, © 2007) and <em>Patient Assessment Checklist</em> (pp. 24–26). Includes scene size-up, primary survey, head-to-toe exam, AMPLE, vital signs, problem / plan pairs and repeat SOAP records.</p><p class="small">This is a documentation companion for your class, not a diagnosis or treatment system. Exam regions are preserved, but the old book’s manipulation instructions (including pelvic compression and log rolling) are not presented as actions to perform. Follow current instructor guidance and your scope of training.</p><p class="small">The emergency reminder follows <a href="https://www.redcross.org/take-a-class/resources/learn-first-aid/unresponsive-and-breathing-person" target="_blank" rel="noopener noreferrer">American Red Cross guidance</a>, checked October 3, 2026 (link requires service). Consent, record management and rescue communication fields are app additions.</p></details><details class="card"><summary>Delete records</summary><p class="small">Export a backup first if you need to keep the information.</p><button class="danger" id="deletePatient">Delete this patient</button><button class="danger" id="resetAll" style="margin-top:10px">Delete all local records</button></details>`}
function render(){editingVital=patient().vitals.some(v=>v.id===patient().draft.id)?patient().draft.id:null;picker();$('#view').innerHTML=({scene:sceneView,history:historyView,vitals:vitalsView,soap:soapView,records:recordsView})[tab]();document.querySelectorAll('[data-tab]').forEach(b=>{if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});tick()}
function navigate(next){tab=next;render();window.scrollTo({top:0,behavior:'instant'})}
function tick(){let p=patient(),box=$('#timerBar');box.hidden=!p.due;if(!p.due)return;const sec=Math.ceil((p.due-Date.now())/1000),min=Math.floor(Math.abs(sec)/60),seconds=Math.abs(sec)%60;box.textContent=sec>0?`Reassessment reminder in ${min}:${String(seconds).padStart(2,'0')} · On-screen only`:`Reassessment reminder due${min?' · '+min+' min ago':''} — reassess and document as appropriate.`}
function intervalMs(){let n=Number(patient().fields.interval);return Number.isFinite(n)&&n>=1&&n<=1440?n*60000:null}
function download(data,name,type){const url=URL.createObjectURL(new Blob([data],{type}));let a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function fileName(ext){return 'SOAP-'+(patient().fields.name||'patient').replace(/[^a-z0-9_-]/gi,'-').slice(0,40)+'-'+new Date().toISOString().slice(0,10)+ext}
function confirmAction(title,msg,action){$('#confirmTitle').textContent=title;$('#confirmText').textContent=msg;$('#confirmYes').onclick=()=>{$('#confirmDialog').close();action()};$('#confirmNo').onclick=()=>$('#confirmDialog').close();$('#confirmDialog').showModal()}
function saveVital(){const p=patient(),v=p.draft;if(!v.at||!Number.isFinite(new Date(v.at).getTime()))return toast('Enter a valid date and time.');if(!vitalFields.some(([k])=>k!=='at'&&String(v[k]||'').trim()))return toast('Enter at least one vital finding.');for(const k of ['rr','hr'])if(v[k]!==undefined&&v[k]!==''&&(!Number.isFinite(Number(v[k]))||Number(v[k])<0||!Number.isInteger(Number(v[k]))))return toast('Rates must be zero or a positive whole number.');let item={...v,id:editingVital||uid()};if(editingVital){const i=p.vitals.findIndex(x=>x.id===editingVital);if(i<0)return toast('That vital set is no longer available.');p.vitals[i]=item}else p.vitals.push(item);editingVital=null;p.draft={at:localNow()};save();render();toast('Vital set saved.')}
function validateBackup(x){const obj=v=>v&&typeof v==='object'&&!Array.isArray(v),strmap=v=>obj(v)&&Object.keys(v).length<150&&Object.values(v).every(z=>typeof z==='string'&&z.length<200000),checks=v=>obj(v)&&Object.keys(v).length<100&&Object.values(v).every(z=>obj(z)&&['','Assessed','Concern','Not applicable','Unable to assess'].includes(z.status||'')&&typeof(z.note??'')==='string'),vital=v=>strmap(v)&&typeof v.id==='string'&&typeof v.at==='string'&&Number.isFinite(new Date(v.at).getTime());if(!obj(x)||x.version!==1||!Array.isArray(x.patients)||x.patients.length>1000)throw Error('Not a Field Notes backup.');const ids=new Set();for(const p of x.patients){if(!obj(p)||typeof p.id!=='string'||ids.has(p.id)||typeof p.created!=='string'||!strmap(p.fields)||!checks(p.checks)||!checks(p.exam)||!strmap(p.draft)||!Array.isArray(p.vitals)||!p.vitals.every(vital)||!Array.isArray(p.snapshots)||!p.snapshots.every(s=>obj(s)&&typeof s.id==='string'&&typeof s.text==='string'&&typeof s.at==='string'&&Number.isFinite(new Date(s.at).getTime()))||!(p.due==null||typeof p.due==='number'&&Number.isFinite(p.due)))throw Error('Backup structure is invalid. No records were imported.');ids.add(p.id)}return x}
function importData(raw){const data=validateBackup(JSON.parse(raw));if(!data.patients.length)throw Error('The backup has no patient records.');const copies=data.patients.map(p=>({...p,id:uid(),fields:{...p.fields,name:(p.fields.name||'Patient')+' (imported)'},due:null}));db.patients.push(...copies);db.active=copies[0].id;editingVital=null;save();render();return copies.length}
document.addEventListener('input',e=>{const t=e.target,p=patient();if(t.dataset.field){p.fields[t.dataset.field]=t.value;save();if(t.dataset.field==='name')picker()}if(t.dataset.vital){p.draft[t.dataset.vital]=t.value;save()}if(t.dataset.checknote){const group=t.dataset.group,key=t.dataset.checknote;p[group][key]={...(p[group][key]||{}),note:t.value};save()}});
document.addEventListener('change',async e=>{const t=e.target,p=patient();if(t.dataset.check){let g=t.dataset.group,k=t.dataset.check;p[g][k]={...(p[g][k]||{}),status:t.value};save()}if(t.id==='patientPick'){db.active=t.value;editingVital=null;save();render()}if(t.id==='importFile'){try{const f=t.files[0];if(!f)return;if(f.size>15000000)throw Error('Backup exceeds 15 MB.');toast(`Imported ${importData(await f.text())} patient record(s).`)}catch(err){toast(err.message)}}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const p=patient();if(b.dataset.tab)return navigate(b.dataset.tab);if(b.dataset.go)return navigate(b.dataset.go);if(b.dataset.editv){editingVital=b.dataset.editv;p.draft={...p.vitals.find(v=>v.id===editingVital)};save();render();window.scrollTo(0,0);return}if(b.dataset.deletev)return confirmAction('Delete vital set?','Saved reassessments keep their earlier copies.',()=>{p.vitals=p.vitals.filter(v=>v.id!==b.dataset.deletev);if(editingVital===b.dataset.deletev){editingVital=null;p.draft={at:localNow()}}save();render()});if(b.dataset.deletes)return confirmAction('Delete reassessment?','This removes that saved snapshot.',()=>{p.snapshots=p.snapshots.filter(s=>s.id!==b.dataset.deletes);save();render()});switch(b.id){
case 'newPatient':{const n=fresh();db.patients.push(n);db.active=n.id;editingVital=null;save();navigate('scene');toast('New patient started. Earlier records kept.');break}
case 'saveVitals':saveVital();break;
case 'stampVitals':p.draft.at=localNow();save();render();break;
case 'cancelVital':editingVital=null;p.draft={at:localNow()};save();render();break;
case 'startTimer':{const ms=intervalMs();if(!ms)return toast('Choose an interval from 1 to 1440 minutes.');p.due=Date.now()+ms;save();tick();toast('On-screen reminder started.');break}
case 'stopTimer':p.due=null;save();tick();break;
case 'snapshot':save();p.snapshots.push({id:uid(),at:new Date().toISOString(),text:note(p)});if(p.due&&intervalMs())p.due=Date.now()+intervalMs();save();render();toast('Reassessment copy saved.');break;
case 'copyNote':try{await navigator.clipboard.writeText(fullNote());toast('SOAP note copied.')}catch{toast('Copy is unavailable here. Use Download .txt or select the preview text.')}break;
case 'shareNote':if(navigator.share){try{await navigator.share({title:'Wilderness SOAP note',text:fullNote()})}catch(err){if(err.name!=='AbortError')toast('Sharing failed. Use Copy text or Download .txt.')}}else toast('Sharing is unavailable here. Use Copy text or Download .txt.');break;
case 'downloadNote':download(fullNote(),fileName('.txt'),'text/plain;charset=utf-8');break;
case 'printNote':$('#printArea').textContent=fullNote();window.print();break;
case 'backup':download(JSON.stringify(db,null,2),'Field-Notes-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json');break;
case 'importButton':$('#importFile').click();break;
case 'deletePatient':confirmAction('Delete this patient?','This cannot be undone without an exported backup.',()=>{db.patients=db.patients.filter(x=>x.id!==p.id);if(!db.patients.length)db.patients.push(fresh());db.active=db.patients[0].id;editingVital=null;save();render()});break;
case 'resetAll':confirmAction('Delete all local records?','All patients in this browser will be removed. Export a backup first.',()=>{loadFailed=false;db={version:1,patients:[fresh()]};db.active=db.patients[0].id;editingVital=null;save();render()});break;
case 'downloadApp':{const copy=document.documentElement.cloneNode(true);copy.querySelector('#view').innerHTML='';copy.querySelector('#patientPick').innerHTML='';copy.querySelector('#printArea').textContent='';copy.querySelector('#toast').textContent='';copy.querySelector('#toast').hidden=true;copy.querySelector('#timerBar').textContent='';copy.querySelector('#timerBar').hidden=true;copy.querySelector('#saveWarning').textContent='';copy.querySelector('#saveWarning').hidden=true;copy.querySelector('#confirmDialog').removeAttribute('open');copy.querySelector('#confirmTitle').textContent='';copy.querySelector('#confirmText').textContent='';copy.querySelectorAll('link[rel=manifest]').forEach(e=>e.remove());download('<!doctype html>\n'+copy.outerHTML,'Wilderness-Field-Notes.html','text/html;charset=utf-8');toast('App downloaded; patient data is only in exported backups.');break}
}});
async function prepareOffline(){const status=$('#offlineStatus');if(location.protocol==='file:'){status.textContent='Self-contained HTML';return}if(!('serviceWorker' in navigator)){status.textContent='Offline cache unavailable';return}try{const reg=await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;const shell=await caches.open('wfa-shell-v1');if(await shell.match(new URL('./',location.href).href)){status.textContent='Offline copy ready'}else{status.textContent='Preparing offline copy';reg.active?.postMessage('CACHE_SHELL')}navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='OFFLINE_READY')status.textContent='Offline copy ready'});}catch{status.textContent='Offline setup failed — see Help'}}
render();if(loadFailed){$('#saveWarning').hidden=false;$('#saveWarning').textContent='Stored data could not be read. Existing storage has not been overwritten. Use Save / Help for backup and recovery.';$('#saveStatus').textContent='Storage needs attention'}else save();setInterval(tick,1000);document.addEventListener('visibilitychange',tick);prepareOffline();
if(location.protocol!=='file:'){const m=document.createElement('link');m.rel='manifest';m.href='./manifest.webmanifest';document.head.append(m)}
try{document.modelContext?.registerTool({name:'read_current_soap_note',title:'Read current SOAP note',description:'Read the currently selected patient record and saved reassessments without modifying records.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length)throw Error('Expected an empty object.');return {note:fullNote()}}})?.catch?.(()=>{})}catch{}
</script></body></html>
